<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flexbox: Wrapping (wrap)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="flexbox_02.css" >
</head>
<body>

  <h1>Flexbox: Horizontal vs. Vertical</h1>

    <h2>Flexbox container with <code>flex-wrap: nowrap</code></h2>

    <div class="container-general flex-container-horizontal">
      <div class="child-in-container ">Child 1</div>
      <div class="child-in-container ">Child 2</div>
      <div class="child-in-container ">Child 3</div>
      <div class="child-in-container ">Child 4</div>
      <div class="child-in-container ">Child 5</div>
    </div>


    <h2>Flexbox container with <code>flex-wrap: wrap</code></h2>

    <div class="container-general container-wrap-an">
      <div class="child-in-container ">Child 1</div>
      <div class="child-in-container ">Child 2</div>
      <div class="child-in-container ">Child 3</div>
      <div class="child-in-container ">Child 4</div>
      <div class="child-in-container ">Child 5</div>
    </div>


    <h2>Flexbox container with <code>flex-direction: row-reverse</code></h2>

    <div class="container-general container-wrap-umgekehrt">
      <div class="child-in-container ">Child 1</div>
      <div class="child-in-container ">Child 2</div>
      <div class="child-in-container ">Child 3</div>
      <div class="child-in-container ">Child 4</div>
      <div class="child-in-container ">Child 5</div>
    </div>

</body>
