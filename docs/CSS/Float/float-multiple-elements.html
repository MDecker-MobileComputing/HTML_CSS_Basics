<!DOCTYPE html>
<html lang="zxx"><!-- Because the pseudo-Latin text "Lorem Ipsum" is used in this page, the language is set to "zxx" (no linguistic content). -->
<head>
  <title>CSS: Float with multiple elements</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="float-multiple-elements.css">
</head>
<body>

  <h1>CSS: Float with multiple elements</h1>

  <section>
    <h2><code>float:none</code> for all elements</h2>
    <div class="square red"   ></div>
    <div class="square green" ></div>
    <div class="square blue"  ></div>
  </section>

  <section>
    <h2><code>float:right</code> for the blue element</h2>
    <div class="square red"              ></div>
    <div class="square green"            ></div>
    <div class="square blue float-right" ></div>
  </section>

  <section>
    <h2><code>float:right</code> for the green element</h2>
    <div class="square red"               ></div>
    <div class="square green float-right" ></div>
    <div class="square blue"              ></div>
  </section>

  <section>
    <h2><code>float:right</code> for the red element</h2>
    <div class="square red    float-right" ></div>
    <div class="square green"              ></div>
    <div class="square blue"               ></div>
  </section>

</body>
