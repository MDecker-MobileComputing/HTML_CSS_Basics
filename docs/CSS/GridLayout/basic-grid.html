<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS: Grid Basics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="basic-grid.css">
</head>
<body>

  <h1>CSS: Grid Basics</h1>

  <h2>Example 1: All Cells</h2>
  <div class="grid-container-3x3">
    <div id="grid-a-cell-1"></div>
    <div id="grid-a-cell-2"></div>
    <div id="grid-a-cell-3"></div>
    <div id="grid-a-cell-4"></div>
    <div id="grid-a-cell-5"></div>
    <div id="grid-a-cell-6"></div>
    <div id="grid-a-cell-7"></div>
    <div id="grid-a-cell-8"></div>
    <div id="grid-a-cell-9"></div>
  </div>


  <h2>Example 2: Individual Cells</h2>
  <div class="grid-container-3x3">
    <div id="grid-b-cell-1"></div>
    <div id="grid-b-cell-3"></div>
    <div id="grid-b-cell-4"></div>
    <div id="grid-b-cell-5"></div>
    <div id="grid-b-cell-2"></div><!-- Order doesn't matter -->
  </div>


  <h2>Example 3: Horizontal Stripes</h2>
  <div class="grid-container-3x3">
    <div id="grid-c-horizontal-stripe-1"></div>
    <div id="grid-c-horizontal-stripe-2"></div>
    <div id="grid-c-horizontal-stripe-3"></div>
  </div>


  <h2>Example 4: Vertical Stripes</h2>
  <div class="grid-container-3x3">
    <div id="grid-d-vertical-stripe-1"></div>
    <div id="grid-d-vertical-stripe-2"></div>
    <div id="grid-d-vertical-stripe-3"></div>
  </div>

</body>
