<!DOCTYPE html>
<html lang="en">
<head>
  <title>CSS: ID and Class Selectors</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="id-vs-class.css">
</head>
<body>

  <h1>CSS: ID and Class Selectors</h1>

  <p class="my_class">This paragraph is assigned to <i>my_class</i>.</p>

  <p>This paragraph is assigned to neither a class nor an ID.</p>

  <p id="my_id">This paragraph is assigned to <i>my_id</i>.</p>

  <p class="my_class">This paragraph is assigned to <i>my_class</i> again.</p>

</body>
