<!DOCTYPE html>
<html lang="en">
<head>
  <title>CSS: Property "display" – Inline vs Block elements</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="inline-vs-block.css">
</head>
<body>

  <h1>Demo for different <code>Display</code> values</h1>

  <h2>Inline in block element</h2>

  <div>
    Lorem Ipsum <span class="inline-color">dolor sit amet</span>, consectetur adipiscing elit.
  </div>


  <h2><code>display:block</code></h2>

  <div class="square-block">abc</div>
  <div class="square-block">abc</div>
  <div class="square-block">abc</div>


  <h2><code>display:inline</code></h2>

  <div class="square-inline">abc</div>
  <div class="square-inline">abc</div>
  <div class="square-inline">abc</div>


  <h2><code>display:inline-block</code></h2>

  <!-- The elements are all in one line, but width+height are evaluated. -->
  <div class="square-inline-block">abc</div>
  <div class="square-inline-block">abc</div>
  <div class="square-inline-block">abc</div>

</body>
