<!DOCTYPE html>
<html lang="en">
<head>
  <title>CSS: Demo for position "absolute"</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="css/position-common.css">
  <link rel="stylesheet" type="text/css" href="css/absolute.css">
</head>
<body>

  <h1>Demo for positions <code>absolute</code></h1>

  <!--
    Without the article element with position != static, the <body> element
    would be used as the coordinate origin for the absolutely positioned element.
  -->
  <article>

    <h2>
      The violett element is positioned absolutely
      with respect to the containing article element
    </h2>

    <span></span>
    <span class="position-absolute"></span>
    <span></span>

  </article>

</body>
