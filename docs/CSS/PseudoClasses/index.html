  <h1>CSS: Pseudo Classes</h1>

  <p>
    In CSS, a pseudo-class is a keyword added to selectors that specifies a 
    special state of the selected elements. 
    You can learn more about pseudo-classes in the 
    <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/Pseudo-classes" 
       target="_blank">MDN Web Docs</a>.
  </p>
