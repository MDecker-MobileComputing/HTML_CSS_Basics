<!DOCTYPE html>
<html lang="en">
<head>
    <title>Table in HTML</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <h1>Table in HTML</h1>

    <table>

      <thead>
        <tr>
          <th>Animal</th>
          <th>Sound</th>
          <th>Favorite Food</th>
        </tr>
      </thead>

      <tbody>

        <tr>
          <td>Cow</td>
          <td>Moo</td>
          <td>Grass</td>
        </tr>
        <tr>
          <td>Dog</td>
          <td>Woof</td>
          <td>Bone</td>
        </tr>
        <tr>
          <td>Cat</td>
          <td>Meow</td>
          <td>Fish</td>
        </tr>
        <tr>
          <td>Sheep</td>
          <td>Baa</td>
          <td>Hay</td>
        </tr>
        <tr>
          <td>Duck</td>
          <td>Quack</td>
          <td>Insects</td>
        </tr>
      </tbody>
    </table>

</body>
