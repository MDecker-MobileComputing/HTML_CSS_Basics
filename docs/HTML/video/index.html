<!DOCTYPE html>
<html lang="en">
<head>
    <title>Video in HTML</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="video-demo.css">
</head>
<body>

  <h1>Video in HTML</h1>

  <p>
    The following video shows how to inspect a password input field using the browser’s developer tools.
  </p>


  <video width="912"
         height="780"
         controls
         loop
         muted
         preload="metadata"
         poster="InspectPasswordElement_Poster.png">

    <source src="InspectPasswordElement.mp4"  type="video/mp4">
    <source src="InspectPasswordElement.webm" type="video/webm"><!-- Fallback -->

    Your browser does not support HTML5 video.

  </video>

  <p>
    The web page presented in the video can be found
    <a href="../form.html" target="_blank">here</a>.
  </p>


  <!--

    The video in MP4 format was recorded using Snagit.

    The MP4 video was converted to webm using ffmpeg with the following command:

      ffmpeg -i rein.mp4 -c:v libvpx-vp9 -crf 30 -b:v 0 -c:a libopus raus.webm

   -->

</body>
